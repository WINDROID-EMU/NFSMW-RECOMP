# APK publico de NFSMW Recompiled.
#
# IMPORTANTE: este APK sale SIN el juego. Sin codigo generado (app/generated-
# android), android/app/build.gradle.kts compila solo la app, los controles
# tactiles, los ajustes y la sonda de Vulkan. El codigo del juego traducido sale
# de TU copia (tools/android/generar_codigo.py) y no se versiona ni se publica
# nunca; ver la seccion Legal del README y el .gitignore. Por eso este workflow
# falla si encuentra codigo generado o ficheros del juego en el arbol.
#
# Como se lanza:
#   - Empujando una etiqueta  vX.Y.Z   -> compila y crea la release publica.
#   - A mano (Actions > Run workflow)  -> compila; con "publicar" tambien crea
#                                         la release (hace falta la etiqueta).
#   - Empujando a una rama  ci/**      -> solo compila, para probar el workflow.
#
# Secretos opcionales (Settings > Secrets and variables > Actions):
#   DEBUG_KEYSTORE_BASE64  Un debug.keystore en base64. El build firma con la
#                          clave de depuracion (ver build.gradle.kts); sin este
#                          secreto cada compilacion sale con una clave nueva y
#                          Android no deja actualizar encima de la anterior.

name: Release APK

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (p. ej. v0.3.0). Solo si se publica."
        required: false
        type: string
      publicar:
        description: "Crear la release publica con el APK"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"
  COMPILE_SDK: "36"

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.info.outputs.version }}
      apk: ${{ steps.info.outputs.apk }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar que no hay juego ni codigo generado
        run: |
          set -eu
          bad=0
          for d in app/generated app/generated-android; do
            if [ -e "$d" ]; then echo "::error::Existe $d: es codigo derivado del juego"; bad=1; fi
          done
          if git ls-files | grep -Ei '\.(xex|xexp|iso|pe|big|bun|viv|apk|aab)$'; then
            echo "::error::Hay ficheros del juego o binarios versionados"; bad=1
          fi
          exit "$bad"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SDK de Android (plataforma, NDK y CMake)
        run: |
          set -eu
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmake/${CMAKE_VERSION}/bin" >> "$GITHUB_PATH"

      # preparar_sdk.py deja el SDK de ReXGlue (v0.10.0) con los parches del
      # port en ../rexglue-sdk-android, que es donde lo busca Gradle. Es lo mas
      # lento: se guarda en cache mientras no cambie nada de lo que lo prepara.
      - name: Cache del SDK de ReXGlue preparado
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../rexglue-sdk-android
          key: rexglue-sdk-android-${{ hashFiles('tools/android/preparar_sdk.py', 'tools/parche_*.py', 'sdk/**') }}

      - name: Preparar el SDK de ReXGlue
        run: python tools/android/preparar_sdk.py

      - name: Clave de firma estable (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Firmando con la clave guardada en el secreto."
          else
            echo "::notice::Sin DEBUG_KEYSTORE_BASE64: se firma con una clave de depuracion nueva."
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Comprobar que el APK no lleva el juego
        run: |
          set -eu
          cfg=$(find android/app/build -name BuildConfig.java -path '*release*' | head -n1)
          test -n "$cfg" || { echo "::error::No encuentro BuildConfig.java"; exit 1; }
          grep -q 'CON_JUEGO = false' "$cfg" || { echo "::error::El APK lleva codigo del juego"; exit 1; }

      - name: Nombre y suma del APK
        id: info
        run: |
          set -eu
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -n1)
          test -n "$version" || { echo "::error::No encuentro versionName"; exit 1; }
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$src" || { echo "::error::No hay APK de release"; exit 1; }
          mkdir -p dist
          apk="NFSMW-Recomp-${version}-arm64-v8a-sin-juego.apk"
          cp "$src" "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256" && cat "$apk.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.info.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Etiqueta de la release
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG:-}"
          fi
          test -n "$tag" || { echo "::error::Falta la etiqueta (campo 'tag')"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bajar el APK
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.build.outputs.version }}
          path: dist

      - name: Crear la release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          set -eu
          cat > notas.md <<NOTAS
          ## NFSMW Recompiled ${VERSION} (Android, arm64-v8a)

          **Este APK no incluye el juego.** Lleva la app, los controles tactiles, los
          ajustes y la sonda de Vulkan. El codigo del juego traducido sale de tu propia
          copia (ver \`docs/android.md\`) y no se distribuye.

          Requisitos: Android 10 o superior (API 29) y un Snapdragon con Vulkan.

          Verificar la descarga:
          \`\`\`
          sha256sum -c ${APK}.sha256
          \`\`\`

          Esta firmado con una clave de depuracion: sirve para instalarlo en tus
          dispositivos, no para una tienda.
          NOTAS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${APK}" "dist/${APK}.sha256" --clobber
          else
            gh release create "$TAG" "dist/${APK}" "dist/${APK}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "NFSMW Recompiled ${VERSION}" \
              --notes-file notas.md
          fi
