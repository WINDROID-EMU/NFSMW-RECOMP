# ============================================================================
#  NFSMW Recomp - configuracion del ejecutable
#
#  El juego lee este archivo al arrancar, desde SU PROPIA CARPETA:
#      <carpeta del .exe>\nfsmw.toml
#
#  El nombre no es el del ejecutable, es el de la app -"nfsmw"-, asi que vale
#  igual al lado de NFS_Most_Wanted.exe que de nfsmw.exe.
#
#  Los argumentos de la linea de comandos MANDAN sobre lo que haya aqui, asi
#  que se puede seguir probando cosas con PROBAR_RTV.bat sin tocar el archivo.
# ============================================================================


# ----------------------------------------------------------------------------
#  Camino de emulacion de la EDRAM
# ----------------------------------------------------------------------------
#
#  QUE ES
#  La Xbox 360 no tiene render targets normales: tiene 10 MB de memoria
#  embebida -la EDRAM- donde el hardware fijo hace la mezcla y el test de
#  profundidad. Emular eso se puede de dos formas:
#
#    "rtv"  render targets del host, usando la GPU de forma normal. Rapido.
#    "rov"  se emula la EDRAM a mano dentro del pixel shader, con interlocks
#           que fuerzan a procesar EN ORDEN los pixeles que se solapan. Es
#           mas exacto y MUCHO mas lento.
#
#  POR QUE ESTA PUESTO A MANO
#  Porque el SDK no elegia por rendimiento sino por FABRICANTE
#  -src/graphics/d3d12/render_target_cache.cpp-:
#
#      path_ = vendor == kIntel ? kPixelShaderInterlock : kHostRenderTargets;
#
#  Si la grafica era Intel, ROV forzado. El motivo esta fechado en el propio
#  comentario del SDK: un bug del driver de Intel de abril de 2021 -una UHD
#  630- por el que la comparacion de stencil "always" no funcionaba. Y encima
#  el comentario de al lado dice "The ROV path is currently much slower
#  generally".
#
#  MEDIDO EN ESTE PROYECTO, en una Intel Iris 540, mismo sitio, sin vsync:
#      rov (lo que forzaba el SDK)    ~10 fps
#      rtv (esto)                     ~18 fps
#
#  Y sin fallos visibles, o sea que el bug de 2021 ya no esta en el driver.
#
#  En NVIDIA y AMD "rtv" ya era el valor por defecto, asi que ponerlo aqui no
#  cambia nada para ellos. Lo unico que hace esta linea es quitar de en medio
#  una decision tomada por marca de tarjeta.
#
#  SI ALGUNA VEZ SE VE MAL -fantasmas, cosas que no se borran, restos del
#  fotograma anterior- se prueba "rov" y se compara.
render_target_path_d3d12 = "rtv"
render_target_path_vulkan = "fbo"
vulkan_async_skip_incomplete_frames = false
vulkan_submit_on_primary_buffer_end = false
readback_resolve = "none"
async_shader_compilation = true
vulkan_dynamic_rendering = true

# ----------------------------------------------------------------------------
#  Otimizações de Iluminação, Sombras e Render Targets
# ----------------------------------------------------------------------------
#  - native_2x_msaa: Desativa amostragem dupla 2x MSAA nos passes de luz e geometria (corta peso de luz pela metade)
#  - gamma_render_target_as_unorm16: Usa sRGB 32-bit acelerado por hardware em vez de UNORM16 64-bit com shader manual
native_2x_msaa = false
gamma_render_target_as_unorm16 = false

# ----------------------------------------------------------------------------
#  Otimizações de Profundidade e Transferências de Sombra
# ----------------------------------------------------------------------------
#  - depth_transfer_not_equal_test: Quando 'true', adiciona um teste de desigualdade extra a cada
#    transferência de depth buffer entre render targets (shadow maps, volume de sombras).
#    Desativar elimina um passe redundante de stencil/depth nos shaders de transferência EDRAM,
#    aliviando significativamente o custo dos passes de sombra do NFSMW (shadowscreenfilter,
#    shadowvolume).
#
#  - clear_memory_page_state: Varre toda a memória GPU-escrita no fim de cada frame para
#    atualizar o estado de validade das páginas. Custo: O(N) de páginas a cada frame.
#    Desnecessário quando não há debug de coherência ativa.
depth_transfer_not_equal_test = false
clear_memory_page_state = false

# ----------------------------------------------------------------------------
#  Cache de Texturas de Render Target (Shadow Maps e Luzes)
# ----------------------------------------------------------------------------
#  O NFSMW usa render targets de shadow map grandes (1024x1024 a 2048x2048).
#  O limite padrão de 24 MB para texturas RT forçava eviction e recriação constante.
#  Aumentar para 96 MB mantém todos os shadow maps na VRAM durante a corrida.
#
#  texture_cache_memory_limit_soft: 512 MB  (era 384 MB - espaço extra para texturas de luz)
#  texture_cache_memory_limit_render_to_texture: 96 MB (era 24 MB - mantém shadow maps na VRAM)
texture_cache_memory_limit_render_to_texture = 96
texture_cache_memory_limit_soft = 512

# ----------------------------------------------------------------------------
#  Resolucao e Desempenho
# ----------------------------------------------------------------------------
#  - video_mode: 1280x720 (Nativo Xbox 360, excelente equilíbrio de FPS)
#  - resolution_scale: 1 (sem supersampling pesado para manter FPS alto)
#  - anisotropic_override: 2 (2x filtragem balanceada)
video_mode_width  = 1280
video_mode_height = 720
resolution_scale  = 1
anisotropic_override = 2
